# Deployment via SSH to the server. There, Caddy serves the directory /mnt/frag-daniel/wumble read-only under
# https://<WUMBLE_HOST>/<path>/ (repo frag-daniel, infra/Caddyfile.prod); without a path the server answers 404.
#
#   production  https://<host>/<WUMBLE_PATH>/                 ← dist/ from every push to main
#   preview     https://<host>/<WUMBLE_PREVIEW_PATH>/pr-<nr>/ ← dist/ per pull request, removed on close
#
# Production and previews live under separate paths: the production path stays secret (secret WUMBLE_PATH), the
# preview path appears in PR comments and environment URLs and is therefore a repository variable
# (WUMBLE_PREVIEW_PATH) – as a secret GitHub would mask it to *** in the environment URL.
# Secrets: DEPLOY_HOST, DEPLOY_USER (default root), DEPLOY_SSH_KEY, WUMBLE_PATH.
# Variables: WUMBLE_PREVIEW_PATH, WUMBLE_HOST (optional).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  SERVER_DIR: /mnt/frag-daniel/wumble

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Forks and Dependabot get no secrets – the deployments are then skipped cleanly.
  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      WUMBLE_PATH: ${{ secrets.WUMBLE_PATH }}
      WUMBLE_PREVIEW_PATH: ${{ vars.WUMBLE_PREVIEW_PATH }}
      WUMBLE_HOST: ${{ vars.WUMBLE_HOST || 'wumble.wer-ist-daniel-schwarz.de' }}
    outputs:
      production: ${{ steps.check.outputs.production }}
      preview: ${{ steps.check.outputs.preview }}
      preview_base: ${{ steps.check.outputs.preview_base }}
    steps:
      - id: check
        run: |
          production=false
          preview=false
          if [ -n "$DEPLOY_HOST" ] && [ -n "$WUMBLE_PATH" ]; then
            production=true
          else
            echo "::notice::DEPLOY_HOST/WUMBLE_PATH not set – no production deployment."
          fi
          if [ -n "$DEPLOY_HOST" ] && [ -n "$WUMBLE_PREVIEW_PATH" ]; then
            preview=true
          else
            echo "::notice::DEPLOY_HOST/WUMBLE_PREVIEW_PATH not set – no preview (pr-<nr>)."
          fi
          {
            echo "production=$production"
            echo "preview=$preview"
            echo "preview_base=https://$WUMBLE_HOST/$WUMBLE_PREVIEW_PATH"
          } >> "$GITHUB_OUTPUT"

  production:
    name: Production
    needs: prerequisites
    if: needs.prerequisites.outputs.production == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      WUMBLE_PATH: ${{ secrets.WUMBLE_PATH }}
      WUMBLE_HOST: ${{ vars.WUMBLE_HOST || 'wumble.wer-ist-daniel-schwarz.de' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:relay # after the app build – vite empties dist/
      - name: SSH key
        run: .github/scripts/ssh-setup.sh
      - name: Upload
        run: |
          T="$DEPLOY_USER@$DEPLOY_HOST"
          DEST="$SERVER_DIR/$WUMBLE_PATH"
          ssh "$T" "mkdir -p '$DEST' && printf 'User-agent: *\nDisallow: /\n' > '$SERVER_DIR/robots.txt'"
          .github/scripts/upload-dir.sh dist "$T" "$DEST"
          scp -q dist/relay/relay.mjs "$T:$SERVER_DIR/relay.mjs.new"
          ssh "$T" "mv -f '$SERVER_DIR/relay.mjs.new' '$SERVER_DIR/relay.mjs'"
          # Restart the relay container (frag-daniel/infra/compose.prod.yml) – not an error if it does not exist yet
          ssh "$T" "docker restart frag-daniel-wumble-relay-1 >/dev/null 2>&1 || true"
      - name: Live check (informational)
        continue-on-error: true
        run: |
          curl -fsS --retry 3 --retry-delay 5 "https://$WUMBLE_HOST/$WUMBLE_PATH/" | grep -q '<title>Wumble' \
            && echo "Live at https://$WUMBLE_HOST/…/" \
            || echo "Not reachable yet – is the server deployment (frag-daniel) still running?"

  preview:
    name: Preview
    needs: prerequisites
    if: needs.prerequisites.outputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ needs.prerequisites.outputs.preview_base }}/pr-${{ github.event.pull_request.number }}/
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      WUMBLE_PREVIEW_PATH: ${{ vars.WUMBLE_PREVIEW_PATH }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      URL: ${{ needs.prerequisites.outputs.preview_base }}/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - name: SSH key
        run: .github/scripts/ssh-setup.sh
      - name: Upload
        run: .github/scripts/upload-dir.sh dist "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/$WUMBLE_PREVIEW_PATH/pr-$PULL_REQUEST_NUMBER"
      - name: Live check
        run: curl -fsS --retry 3 --retry-delay 5 "$URL" | grep -q '<title>Wumble' && echo "Live at $URL"
      - name: PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATUS: deployed
          PREVIEW_URL: ${{ env.URL }}
          DEPLOYED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/preview-comment.sh

  remove-preview:
    name: Remove preview
    needs: prerequisites
    if: needs.prerequisites.outputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      WUMBLE_PREVIEW_PATH: ${{ vars.WUMBLE_PREVIEW_PATH }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        run: .github/scripts/ssh-setup.sh
      - name: Delete directory
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$SERVER_DIR/$WUMBLE_PREVIEW_PATH/pr-$PULL_REQUEST_NUMBER'"
      - name: Deactivate environment
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview-pr-$PULL_REQUEST_NUMBER&per_page=100" --jq '.[].id'); do
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -f description='Preview removed' --silent
          done
      - name: PR comment
        env:
          PREVIEW_STATUS: removed
        run: .github/scripts/preview-comment.sh
