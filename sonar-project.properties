sonar.organization=bartfastiel-github
sonar.projectKey=bartfastiel_wumble

sonar.sources=src,relay
sonar.tests=src,e2e,relay
sonar.test.inclusions=**/*.test.ts,e2e/**
sonar.exclusions=dist/**,public/**,src/**/__fixtures__/**

# Unit coverage (Vitest) and e2e coverage (Playwright, tools/e2e-coverage.mjs) count together
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/e2e/lcov.info
sonar.coverage.exclusions=**/*.test.ts,src/**/__fixtures__/**,src/**/*.d.ts
# Data tables (songs, grooves) look like copies to duplicate detection; de/en share the same structure by design
sonar.cpd.exclusions=src/learn/songs/**,src/band/grooves.ts,src/i18n/**
sonar.sourceEncoding=UTF-8
