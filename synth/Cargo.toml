[package]
name = "wumble-synth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The sound engine of Wumble: a learned violin, rendered in an AudioWorklet"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
